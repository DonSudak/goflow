[package]
name = "goflow-ut"
version = "0.3.0"
description = "Go Flow narrative editor, local edition for Useless Tycoon"
edition = "2021"
license = "AGPL-3.0"

[lib]
name = "goflow_ut_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
